<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5a3b22">
<title>ブロックハンター</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap">
<style>
/* ブロックハンター: 色ごとのアリの壺を送り出して、ドット絵を食べ尽くすパズル。
   画面は幅540×高さ1060の論理座標を1枚のcanvasに描き、端末の画面に収まるように拡縮する。 */
:root{
  --bg:#3b2614; --paper:#f6ead2; --ink:#2b1d10;
  --font-disp:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
body{font-family:var(--font-disp);color:var(--paper);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-text-size-adjust:100%}
#wrap{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#game{position:absolute;left:0;top:0;width:540px;height:1060px;transform-origin:0 0;display:block;touch-action:none;cursor:pointer}
#ov{position:absolute;left:0;top:0;width:540px;height:1060px;transform-origin:0 0;display:none;align-items:center;justify-content:center;background:rgba(30,18,8,.72)}
#ov.on{display:flex}
.card{width:420px;box-sizing:border-box;padding:30px 28px 26px;border-radius:26px;background:linear-gradient(#fff8e8,#f3e2c0);color:var(--ink);text-align:center;box-shadow:0 14px 0 #8a5a2b,0 24px 40px rgba(0,0,0,.45);border:4px solid #c08a4d}
.card h1{margin:0 0 8px;font-size:44px;font-weight:900;letter-spacing:.02em;line-height:1.15}
.card h2{margin:0 0 10px;font-size:34px;font-weight:900;line-height:1.2}
.card p{margin:6px 0 0;font-size:19px;font-weight:700;line-height:1.5;color:#5a4330}
.card .sub{font-size:16px;color:#7b6248}
.btn{display:block;width:100%;box-sizing:border-box;margin-top:16px;padding:16px 10px;border:0;border-radius:18px;font-family:var(--font-disp);font-weight:900;font-size:26px;line-height:1;color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn.go{background:linear-gradient(#ffb43a,#f08a12);box-shadow:0 6px 0 #a85a06;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.sub{background:linear-gradient(#8fb4c9,#5f879e);box-shadow:0 6px 0 #37586b;font-size:21px;padding:13px 10px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.ants{font-size:40px;line-height:1;margin-bottom:6px}
.cps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:14px}
.cpl{font-size:16px;font-weight:700;color:#7b6248}
.cp{padding:10px 13px;border-radius:12px;border:2px solid #c08a4d;background:#fffaf0;color:#5a3b22;font-family:var(--font-disp);font-weight:900;font-size:17px;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;box-shadow:0 3px 0 #c08a4d}
.cp:active{transform:translateY(2px);box-shadow:0 1px 0 #c08a4d}
.cp:focus-visible{outline:3px solid #f08a12;outline-offset:2px}
.help{text-align:left;font-size:17px;line-height:1.55;margin:12px 0 0;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.55);color:#4a3523}
.help b{color:#c2410c}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="540" height="1060"></canvas>
  <div id="ov"><div class="card" id="card"></div></div>
</div>
<script>
(() => {
'use strict';
const LW = 540, LH = 1060;              // 論理座標
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const ov = document.getElementById('ov');
const card = document.getElementById('card');
const DPR = Math.min(2, window.devicePixelRatio || 1);
let scale = 1, offX = 0, offY = 0;

function fit(){
  const vw = window.innerWidth, vh = window.innerHeight;
  scale = Math.min(vw / LW, vh / LH);
  offX = Math.floor((vw - LW * scale) / 2);
  offY = Math.floor((vh - LH * scale) / 2);
  const tf = `translate(${offX}px,${offY}px) scale(${scale})`;
  cv.style.transform = tf; ov.style.transform = tf;
  cv.width = Math.round(LW * DPR); cv.height = Math.round(LH * DPR);
  cv.style.width = LW + 'px'; cv.style.height = LH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  boardDirty = true;
}
window.addEventListener('resize', fit);

// ---------- 乱数（レベルごとに同じ並びを再現できるように seed 付き） ----------
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = Math.random;

// ---------- 色（ビーズ風の明るい色。各色に名前を付けてアリの色にも使う） ----------
const COL = {
  red:'#e84a3f', dkred:'#b3262b', orange:'#f5902c', yellow:'#f8d13a', green:'#4ec95a', dkgreen:'#2f8f3e',
  blue:'#3d8ef0', lblue:'#74d4f6', purple:'#9a5ce6', pink:'#f792b8', brown:'#8d5a2b', dkbrown:'#5c3317',
  lbrown:'#d6a26a', tan:'#f2dcae', white:'#fbf8f1', black:'#3b3b3b', mint:'#7de8c9', salmon:'#ff8f5a', cream:'#fff0c2',
  gray:'#a3a9b1', dkgray:'#626a74', navy:'#2c4f9e'
};
// 既存の色と見分けがつく「同系の別の濃さ」を1つ返す（明るい色は暗く、暗い色は明るく。近すぎる候補は飛ばす）
function variantColor(hex, used){
  const rgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
  const dist = (a, b) => { const p = rgb(a), q = rgb(b); return Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]); };
  const [r, g, b] = rgb(hex); const lum = (0.3 * r + 0.59 * g + 0.11 * b) / 255;
  const ks = lum > 0.55 ? [0.74, 0.6, 1.3, 0.48] : [1.45, 1.75, 0.6, 2.1];
  for (const k of ks){ const c = shade(hex, k); if (used.every(u => dist(u, c) >= 52)) return c; }
  return null;
}
function shade(hex, k){ // k<1 で暗く、>1 で明るく
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = v => Math.max(0, Math.min(255, Math.round(k >= 1 ? v + (255 - v) * (k - 1) : v * k)));
  return '#' + ((f(r) << 16) | (f(g) << 8) | f(b)).toString(16).padStart(6, '0');
}

// ---------- ドット絵の描画（デザイン座標 → セルに塗る） ----------
// 形は順番に塗り重ねる（後のものが上）。色 0 は消しゴム。
function Pic(){ this.sh = []; this.post = []; }
Pic.prototype = {
  c(x, y, r, col){ this.sh.push({ t: 'c', x, y, r, col }); return this; },
  e(x, y, rx, ry, col){ this.sh.push({ t: 'e', x, y, rx, ry, col }); return this; },
  r(x0, y0, x1, y1, col){ this.sh.push({ t: 'r', x0, y0, x1, y1, col }); return this; },
  p(pts, col){ this.sh.push({ t: 'p', pts, col }); return this; },
  l(x0, y0, x1, y1, w, col){ this.sh.push({ t: 'l', x0, y0, x1, y1, w, col }); return this; },
  seeds(col, sx, sy, ox, oy, onlyCol){ this.post.push({ t: 'seeds', col, sx, sy, ox, oy, onlyCol }); return this; },
  hit(s, x, y){
    switch (s.t){
      case 'c': { const dx = x - s.x, dy = y - s.y; return dx * dx + dy * dy <= s.r * s.r; }
      case 'e': { const dx = (x - s.x) / s.rx, dy = (y - s.y) / s.ry; return dx * dx + dy * dy <= 1; }
      case 'r': return x >= s.x0 && x <= s.x1 && y >= s.y0 && y <= s.y1;
      case 'l': { const dx = s.x1 - s.x0, dy = s.y1 - s.y0, L = dx * dx + dy * dy || 1;
        let t = ((x - s.x0) * dx + (y - s.y0) * dy) / L; t = Math.max(0, Math.min(1, t));
        const px = s.x0 + t * dx - x, py = s.y0 + t * dy - y; return px * px + py * py <= s.w * s.w / 4; }
      case 'p': { const p = s.pts; let inside = false;
        for (let i = 0, j = p.length - 1; i < p.length; j = i++){
          const xi = p[i][0], yi = p[i][1], xj = p[j][0], yj = p[j][1];
          if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
        } return inside; }
    } return false;
  },
  // bw×bh のデザイン座標を k 倍のセル数に描く
  raster(bw, bh, k){
    const W = Math.round(bw * k), H = Math.round(bh * k), g = new Array(W * H).fill(0);
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++){
      const x = (c + 0.5) / k, y = (r + 0.5) / k; let col = 0;
      for (const s of this.sh) if (this.hit(s, x, y)) col = s.col;
      g[r * W + c] = col;
    }
    for (const q of this.post){
      if (q.t === 'seeds'){
        for (let r = 0; r < H; r++) for (let c = 0; c < W; c++){
          const x = (c + 0.5) / k, y = (r + 0.5) / k, i = r * W + c;
          if (!g[i] || (q.onlyCol && g[i] !== q.onlyCol)) continue;
          const u = (x - q.ox) / q.sx, v = (y - q.oy) / q.sy;
          const fu = u - Math.round(u), fv = v - Math.round(v);
          if (Math.abs(fu) * q.sx * k < 0.5 && Math.abs(fv) * q.sy * k < 0.5) g[i] = q.col;
        }
      }
    }
    return { W, H, g };
  }
};

    for (const [x,y] of [[8,15],[12,12],[16,15],[10,17],[14,17],[12,15.5],[7.5,17.8],[16.5,17.8]]) P.e(x, y, 0.7, 1.1, COL.black);

  { name:'プリン', bw:22, bh:22, draw(P){

// ---------- 乗り物6種 ----------
const VEHICLES = [

function rasterPic(p, k){ const P = new Pic(); p.draw(P); return P.raster(p.bw, p.bh, k); }
function blockCount(g){ let n = 0; for (const v of g) if (v) n++; return n; }
// 色を増やす（16面から1色・31面から2色）: いちばん多い色（次いで2番目）を右下側の半分だけ別の濃さにする（陰影のように見える）
function applyExtras(g, W, H, extra){
  if (!extra) return g;
  const cnt = {}; for (const v of g) if (v) cnt[v] = (cnt[v] || 0) + 1;
  const order = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]); const used = order.map(k => COL[k] || k);
  for (let e = 0; e < extra && e < order.length; e++){
    const src = order[e]; const nc = variantColor(COL[src] || src, used); if (!nc) continue; used.push(nc);
    const cells = []; for (let i = 0; i < g.length; i++) if (g[i] === src) cells.push(i);
    const diag = i => (i % W + 0.5) / W + (Math.floor(i / W) + 0.5) / H;
    cells.sort((a, b) => diag(a) - diag(b)); const th = diag(cells[Math.floor(cells.length / 2)]);
    for (const i of cells) if (diag(i) >= th) g[i] = nc;
  }
  return g;
}
function picColors(p, k, extra){ const { W, H, g } = rasterPic(p, k); applyExtras(g, W, H, extra); return new Set(g.filter(v => v)).size; }
// 1周の並び: 名画以外は「基準サイズでのブロック数が少ない順」、名画は10面から最後まで等間隔（連続しない）
function buildOrder(filter){
  const base = [...FOODS, ...VEHICLES, ...APPLIANCES, ...TOOLS].filter(filter).map(p => ({ p, n: blockCount(rasterPic(p, 1).g) }));
  base.sort((a, b) => a.n - b.n);
  const paints = PAINTINGS.filter(filter);
  const total = base.length + paints.length, first = Math.min(10, total), last = total;
  const at = new Set(paints.map((p, i) => first + Math.round(i * (last - first) / Math.max(1, paints.length - 1))));
  const out = []; let pi = 0, bi = 0;
  for (let lv = 1; lv <= total; lv++) out.push((at.has(lv) && pi < paints.length) ? paints[pi++] : (bi < base.length ? base[bi++].p : paints[pi++]));
  return out;
}
const CYCLE1 = buildOrder(() => true);                                  // 1周目: 全42種
const CYCLE2 = buildOrder(p => picColors(p, 1.5, 2) >= 6);              // 2周目以降: 色数（追加色込み）が5以下の絵は出さない
const PICS = CYCLE1;
function levelPos(lv){ // レベル → 周・周内の位置・その周の並び
  if (lv <= CYCLE1.length) return { cyc: 0, idx: lv - 1, order: CYCLE1 };
  const r = lv - CYCLE1.length - 1; return { cyc: 1 + Math.floor(r / CYCLE2.length), idx: r % CYCLE2.length, order: CYCLE2 };
}
const limitCache = new Map();
function nextPaintingLimit(pos){ // 周内で次に出る名画のブロック数（名画以外はこれより少なくする）
  const { cyc, idx, order } = pos; let j = idx + 1; while (j < order.length && !order[j].paint) j++;
  if (j >= order.length) return null; const key = cyc + ':' + order.length + ':' + j; if (limitCache.has(key)) return limitCache.get(key);
  const p = order[j]; const k = Math.min(cyc >= 1 ? 1.5 : 1, MAXDIM / Math.max(p.bw, p.bh));
  const n = blockCount(rasterPic(p, k).g); limitCache.set(key, n); return n;
}

const NCOL = 5, NSLOT = 5;
const MAXDIM = 36;
function levelSpec(lv){
  const pos = levelPos(lv), { cyc, idx } = pos; const food = pos.order[idx]; const inLv = idx + 1;
  // 1周目は基準サイズ、同じ絵が2回目以降に出るときは1.5倍（最大36マスで頭打ち＝3周目は2周目と同じ）
  const baseK = Math.min(cyc >= 1 ? 1.5 : 1, MAXDIM / Math.max(food.bw, food.bh));
  let k = baseK, limit = null;
  if (!food.paint){
    // 名画以外は周の6面・11面・16面…と5面ごとにブロック数を2割ずつ増やす（ただし次に出る名画より少なく＝makeLevelで抑える）
    const step = inLv >= 6 ? Math.floor((inLv - 1) / 5) : 0;
    k = Math.min(MAXDIM / Math.max(food.bw, food.bh), baseK * Math.sqrt(1 + 0.2 * step));
    limit = nextPaintingLimit(pos);
  }
  const noise = Math.max(0, Math.min(0.05, (lv - 4) * 0.0025));         // 5面目からまだら
  const shuffle = Math.min(7, 1 + Math.floor((lv - 1) / 4));            // 山札の混ぜ具合
  const chunk = 22 + Math.min(18, lv * 0.6);                              // 壺1つの平均アリ数
  return { food, k, baseK, limit, noise, shuffle, chunk };
}

// 外（リング）から届く範囲を測る。sx: スタート列（下のリングのどのセルから入るか）。
// 戻り値 dist は (W+2)×(H+2) のリング込み座標で、通れるセル（空き・リング）だけに距離が入る。
function field(grid, W, H, sx){
  const GW = W + 2, GH = H + 2, N = GW * GH;
  const dist = new Float32Array(N).fill(Infinity), par = new Int32Array(N).fill(-1);
  const pass = i => { const c = i % GW - 1, r = Math.floor(i / GW) - 1; return c < 0 || r < 0 || c >= W || r >= H || grid[r * W + c] === 0; };
  // 簡易ダイクストラ（コストは整数なのでバケット）
  const start = (H + 1) * GW + (sx + 1); dist[start] = 0;
  const q = [start]; let qi = 0;
  while (qi < q.length){
    const i = q[qi++]; const d = dist[i];
    const c = i % GW, r = Math.floor(i / GW);
    const nb = [];
    if (c > 0) nb.push(i - 1); if (c < GW - 1) nb.push(i + 1); if (r > 0) nb.push(i - GW); if (r < GH - 1) nb.push(i + GW);
    for (const j of nb){ if (!pass(j)) continue; if (dist[j] > d + 1){ dist[j] = d + 1; par[j] = i; q.push(j); } }
  }
  return { dist, par, GW, GH };
}
// ブロック (c,r) に届くか: 隣に距離つきの通れるセルがあるか。届くなら [距離, 隣のリング座標index]
function reach(F, grid, W, H, c, r){
  const GW = F.GW; let best = Infinity, bi = -1;
  const i = (r + 1) * GW + (c + 1);
  for (const j of [i - 1, i + 1, i - GW, i + GW]){ const d = F.dist[j]; if (d < best){ best = d; bi = j; } }
  return bi < 0 ? null : [best + 1, bi];
}

// 外側から1層ずつはがす順（色ごとの出てくる順番 → 山札の並びの基準にする）
function peelOrder(grid, W, H){
  const g = grid.slice(); const layer = new Int16Array(W * H).fill(-1); let L = 0, left = g.filter(v => v).length;
  while (left > 0){
    const F = field(g, W, H, Math.floor(W / 2)); const rm = [];
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) if (g[r * W + c] && reach(F, g, W, H, c, r)) rm.push(r * W + c);
    if (!rm.length) break;
    for (const i of rm){ layer[i] = L; g[i] = 0; } left -= rm.length; L++;
  }
  return layer;
}

// 山札を作る: 色ごとの総数を壺に分け、はがれる順に並べて5列に配る
function buildStacks(grid, W, H, spec, R){
  const layer = peelOrder(grid, W, H);
  const byCol = {};
  for (let i = 0; i < W * H; i++) if (grid[i]){ (byCol[grid[i]] = byCol[grid[i]] || []).push(layer[i]); }
  const tiles = [];
  for (const col in byCol){
    const ls = byCol[col].sort((a, b) => a - b); const T = ls.length;
    let n = Math.max(1, Math.round(T / spec.chunk)); if (T >= 10 && n === 1 && R() < 0.5) n = 2;
    // ランダムな分割（最小5、合計Tぴったり）
    const cuts = []; let rest = T;
    for (let j = 0; j < n; j++){
      const remain = n - j - 1; let size;

// ふつうに遊んで解けるかの簡易チェック（届く色を優先して送る）
function solvable(grid, W, H, stacks0){
  const g = grid.slice(); const st = stacks0.map(s => s.map(t => ({ col: t.col, n: t.n })));
  let slots = []; let left = g.filter(v => v).length; let guard = 0;
  const reachable = col => { const F = field(g, W, H, Math.floor(W / 2)); const out = [];
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++){ const i = r * W + c; if (g[i] === col && reach(F, g, W, H, c, r)) out.push(i); } return out; };
  while (left > 0 && guard++ < 5000){
    let moved = true;
    while (moved){ moved = false;
      for (const s of slots){ if (s.n <= 0) continue; const rs = reachable(s.col); if (!rs.length) continue;
        const take = Math.min(s.n, rs.length); for (let j = 0; j < take; j++) g[rs[j]] = 0; s.n -= take; left -= take; moved = true; }
      slots = slots.filter(s => s.n > 0);
    }
    if (left <= 0) return true;
    // 送る壺を選ぶ: 届くブロックが多い色の山札トップ
    let best = -1, bestV = -1;
    for (let i = 0; i < NCOL; i++){ const t = st[i][0]; if (!t) continue; const v = reachable(t.col).length; if (v > bestV){ bestV = v; best = i; } }
    if (best < 0) return false;
    if (bestV === 0){ // 届く色が無い: 空き枠があれば次の壺が届く色の列を1つ退かす
      if (slots.length >= NSLOT) return false;
      let alt = -1; for (let i = 0; i < NCOL; i++){ const u = st[i][1]; if (u && reachable(u.col).length > 0){ alt = i; break; } }
      best = alt >= 0 ? alt : best;
    }
    if (slots.length >= NSLOT) return false;

function makeLevel(lv, seed){
  const spec = levelSpec(lv); const R = mulberry32(seed);

  // まだら: 塗ってあるセルの一部を絵の中の別の色に置き換える（外周2マスは触らない＝輪郭を残す）
  if (spec.noise > 0){
    const cols = [...new Set(g.filter(v => v))];
    for (let i = 0; i < g.length; i++) if (g[i] && R() < spec.noise){ const c = i % W, r = Math.floor(i / W);
      let edge = false; for (const [dc, dr] of [[1,0],[-1,0],[0,1],[0,-1]]){ const cc = c + dc, rr = r + dr; if (cc < 0 || rr < 0 || cc >= W || rr >= H || !g[rr * W + cc]) edge = true; }
      if (!edge) g[i] = cols[Math.floor(R() * cols.length)]; }
  }
  let stacks = null;
  for (let tries = 0; tries < 24; tries++){
    const sp = Object.assign({}, spec, { shuffle: Math.max(0, spec.shuffle - Math.floor(tries / 4)) });
    const s = buildStacks(g, W, H, sp, R);
    if (solvable(g, W, H, s)){ stacks = s; break; }
    if (tries === 23) stacks = s;
  }
  return { lv, seed, name: spec.food.name, W, H, grid: g, stacks, total: blockCount(g), k, limit: spec.limit };
}
// ---------- 画面の配置（論理座標） ----------
const PLATE = { x: 28, y: 76, w: 484, h: 460, pad: 16 };

const SLOT_Y = 636, SLOT_H = 80, SLOT_W = 78;
const TILE_Y = 748, TILE_H = 70, TILE_W = 78, ROW_GAP = 78, ROWS_SHOWN = 4;

// ---------- ゲーム状態 ----------

let boardDirty = true, bc = null, bcx = null;

let muted = false; try { muted = (localStorage.getItem('bh_mute') || localStorage.getItem('fh_mute')) === '1'; } catch (e) {}

let now = 0, last = 0;

function startLevel(lv, seed){

    stacks: L.stacks.map(s => s.map(t => ({ col: t.col, n: t.n }))),
    slots: Array.from({ length: NSLOT }, () => null),   // {col,n,tNext,sx,F,dirty,arr}

const cellPx = (c, r) => [G.px0 + (c + 0.5) * G.cs, G.py0 + (r + 0.5) * G.cs];

// 壺（枠）からアリを1匹送り出す
function dispatch(s, si){

  let best = Infinity, bc = -1, br = -1, bi = -1;
  for (let r = 0; r < G.H; r++) for (let c = 0; c < G.W; c++){
    const i = r * G.W + c; if (G.grid[i] !== s.col || G.reserved[i]) continue;
    const q = reach(s.F, G.grid, G.W, G.H, c, r); if (q && q[0] < best){ best = q[0]; bc = c; br = r; bi = q[1]; }

  const cells = []; for (let j = bi; j >= 0; j = s.F.par[j]) cells.push(j); cells.reverse();
  const path = [[colX(si), SLOT_Y + 6]]; for (const j of cells) path.push(idxPx(s.F, j)); path.push(cellPx(bc, br));
  const back = []; for (let j = cells.length - 1; j >= 0; j--) back.push(idxPx(s.F, cells[j])); back.push([HOLE.x + (rnd() - 0.5) * 20, HOLE.y]);

function updateAnts(dt){
  const A = G.ants;
  for (let k = A.length - 1; k >= 0; k--){
    const a = A[k]; a.t += dt;
    if (a.st === 1){ if (a.t > 0.2){ a.st = 2; a.path = a.back; a.i = 0; a.t = 0; } continue; }
    let step = a.sp * dt;
    while (step > 0 && a.i < a.path.length){
      const [tx, ty] = a.path[a.i]; const dx = tx - a.x, dy = ty - a.y, d = Math.hypot(dx, dy);
      if (d <= step){ a.x = tx; a.y = ty; step -= d; a.i++; }

    }
    if (a.i >= a.path.length){

        if (G.grid[i]){ G.grid[i] = 0; G.left--; G.reserved[i] = 0; markGridChanged(); burst(a.x, a.y, COL[a.col] || a.col); pop(); }
        const rp = returnPath(a.c, a.r); if (rp) a.back = rp;   // 最短の帰り道（取れなければ来た道を戻る）
        a.st = 1; a.t = 0;
      } else { // 穴に帰った
        G.rip.push({ x: a.x, y: a.y, t: 0, col: a.col }); A.splice(k, 1);

}
function burst(x, y, col){ for (let j = 0; j < 4; j++) G.parts.push({ x, y, vx: (rnd() - 0.5) * 160, vy: -40 - rnd() * 120, t: 0, col, s: 3 + rnd() * 3 }); if (G.parts.length > 240) G.parts.splice(0, G.parts.length - 240); }

function update(dt){

  // 残りの壺が空いた枠の数以下になったら、自動で枠に入れていく（→山札が空になり倍速でクリアへ）
  const remain = G.stacks.reduce((a, s) => a + s.length, 0);
  const free = G.slots.filter((s, k) => !s && !G.flying.some(f => f.slot === k)).length;
  if (remain > 0 && remain <= free){ G.autoT -= dt; if (G.autoT <= 0){ const i = G.stacks.findIndex(s => s.length); if (i >= 0) tapColumn(i); G.autoT = 0.12; } }

  G.time += dt; now += dt;

    if (f.t >= 0.26){ G.slots[f.slot] = { col: f.col, n: f.n, tNext: now, sx: Math.max(0, Math.min(G.W - 1, Math.round((colX(f.slot) - G.px0) / G.cs - 0.5))), F: null, dirty: true, arr: 0 }; G.flying.splice(k, 1); } }

// 山札の上の壺をタップ
function tapColumn(i){

// ---------- 音（WebAudio。ミュート可） ----------
let AC = null, lastPop = 0;
function ac(){ if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }

let wood = null;
function drawWood(){
  if (!wood){ wood = document.createElement('canvas'); wood.width = LW * DPR; wood.height = LH * DPR; const w = wood.getContext('2d'); w.scale(DPR, DPR);
    w.fillStyle = '#c99257'; w.fillRect(0, 0, LW, LH);
    for (let x = 0; x < LW; x += 108){ w.fillStyle = x % 216 ? '#cb9659' : '#c48c50'; w.fillRect(x, 0, 108, LH); w.fillStyle = 'rgba(80,40,10,.18)'; w.fillRect(x, 0, 3, LH);

  g.beginPath(); g.arc(6, 0, 5.4, 0, 7); g.fill(); g.stroke();
  // つや
  g.fillStyle = light; g.globalAlpha = 0.7; g.beginPath(); g.ellipse(-9.5, -1.6, 2.2, 1.1, -0.3, 0, 7); g.fill(); g.beginPath(); g.arc(4.2, -2.6, 1.3, 0, 7); g.fill(); g.globalAlpha = 1;
  // 目（大きめ・白目＋黒目＋ハイライト）
  g.fillStyle = '#fff'; g.strokeStyle = dark; g.lineWidth = 0.8;
  for (const y of [-2.4, 2.4]){ g.beginPath(); g.ellipse(7.6, y, 2.1, 2.4, 0, 0, 7); g.fill(); g.stroke(); }
  g.fillStyle = '#1e1e1e'; for (const y of [-2.2, 2.2]){ g.beginPath(); g.ellipse(8.3, y, 1.25, 1.5, 0, 0, 7); g.fill(); }
  g.fillStyle = '#fff'; for (const y of [-2.9, 1.5]){ g.beginPath(); g.arc(8.8, y, 0.55, 0, 7); g.fill(); }
  // ほっぺ・口
  g.fillStyle = 'rgba(255,120,150,.55)'; for (const y of [-4.6, 4.6]){ g.beginPath(); g.ellipse(5.2, y, 1.3, 0.9, 0, 0, 7); g.fill(); }
  g.strokeStyle = dark; g.lineWidth = 0.9; g.beginPath(); g.arc(10.2, 0, 1.1, -1.1, 1.1); g.stroke();
  sprites.set(key, c); return c;
}
function drawBoard(){
  const cs = G.cs;
  if (!bc){ bc = document.createElement('canvas'); bcx = bc.getContext('2d'); }
  if (boardDirty){ bc.width = PLATE.w * DPR; bc.height = PLATE.h * DPR; bcx.setTransform(DPR, 0, 0, DPR, 0, 0); bcx.clearRect(0, 0, PLATE.w, PLATE.h);
    const ox = G.px0 - PLATE.x, oy = G.py0 - PLATE.y;
    for (let r = 0; r < G.H; r++) for (let c = 0; c < G.W; c++){ const v = G.grid[r * G.W + c]; if (!v) continue; const col = COL[v] || v;
      const x = ox + c * cs, y = oy + r * cs, s = cs - 1;
      bcx.fillStyle = shade(col, 0.7); bcx.fillRect(x, y, s, s);
      bcx.fillStyle = col; bcx.fillRect(x, y, s - 1, s - 1);
      bcx.fillStyle = 'rgba(255,255,255,.35)'; bcx.fillRect(x, y, s - 1, 1); bcx.fillRect(x, y, 1, s - 1); }
    boardDirty = false; }
  ctx.drawImage(bc, PLATE.x, PLATE.y, PLATE.w, PLATE.h);
}
function tile(x, y, w, h, col, n, dim){
  const c = COL[col] || col;
  ctx.fillStyle = shade(c, 0.55); rr(x - w / 2, y - h / 2 + 6, w, h, 12); ctx.fill();
  ctx.fillStyle = c; rr(x - w / 2, y - h / 2, w, h - 6, 12); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.28)'; rr(x - w / 2 + 5, y - h / 2 + 4, w - 10, 10, 5); ctx.fill();
  ctx.font = '900 30px ' + getComputedStyle(document.body).fontFamily; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 5; ctx.strokeStyle = shade(c, 0.5); ctx.lineJoin = 'round'; ctx.strokeText(n, x, y - 2); ctx.fillStyle = '#fff'; ctx.fillText(n, x, y - 2);
  if (dim === 'top'){ ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.85)'; rr(x - w / 2 - 2, y - h / 2 - 2, w + 4, h + 10, 14); ctx.stroke(); }
}
function draw(){
  drawWood();
  // ヘッダー
  ctx.textBaseline = 'middle'; ctx.font = '900 26px ' + getComputedStyle(document.body).fontFamily; ctx.textAlign = 'left';
  ctx.fillStyle = '#fff3dc'; ctx.fillText(L ? 'レベル ' + L.lv + '　' + L.name : 'ブロックハンター', 20, 33, 372);   // 長い名前は詰めて収める
  for (const [x, ch] of [[420, '？'], [470, muted ? '🔇' : '🔊'], [520, '↻']]){ ctx.fillStyle = 'rgba(60,30,10,.55)'; ctx.beginPath(); ctx.arc(x, 33, 20, 0, 7); ctx.fill(); ctx.fillStyle = '#fff3dc'; ctx.textAlign = 'center'; ctx.font = '900 22px ' + getComputedStyle(document.body).fontFamily; ctx.fillText(ch, x, 34); }
  if (!G) return;
  // 皿（板）
  ctx.fillStyle = 'rgba(0,0,0,.25)'; rr(PLATE.x + 4, PLATE.y + 8, PLATE.w, PLATE.h, 16); ctx.fill();
  ctx.fillStyle = '#efe0c8'; rr(PLATE.x, PLATE.y, PLATE.w, PLATE.h, 16); ctx.fill();
  ctx.fillStyle = '#f7ecd8'; rr(PLATE.x + 6, PLATE.y + 6, PLATE.w - 12, PLATE.h - 12, 12); ctx.fill();
  drawBoard();
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.font = '700 18px ' + getComputedStyle(document.body).fontFamily; ctx.fillStyle = '#9a7a55'; ctx.fillText('のこり ' + G.left, PLATE.x + PLATE.w - 16, PLATE.y + 20);
  // 穴
  ctx.fillStyle = '#7a4a22'; ctx.beginPath(); ctx.ellipse(HOLE.x, HOLE.y + 3, HOLE.rx + 6, HOLE.ry + 5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#2b170a'; ctx.beginPath(); ctx.ellipse(HOLE.x, HOLE.y, HOLE.rx, HOLE.ry, 0, 0, 7); ctx.fill();
  for (const p of G.rip){ ctx.strokeStyle = 'rgba(255,230,180,' + (1 - p.t / 0.4) + ')'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(p.x, p.y, 8 + p.t * 60, 4 + p.t * 30, 0, 0, 7); ctx.stroke(); }
  // 枠（ゆれ）
  const sh = G.shake > 0 ? Math.sin(G.shake * 60) * 6 : 0;
  for (let i = 0; i < NSLOT; i++){ const x = colX(i) + sh, s = G.slots[i];
    if (!s){ ctx.fillStyle = 'rgba(0,0,0,.18)'; rr(x - SLOT_W / 2, SLOT_Y + 4, SLOT_W, SLOT_H, 12); ctx.fill(); ctx.fillStyle = '#fff8ea'; rr(x - SLOT_W / 2, SLOT_Y, SLOT_W, SLOT_H - 4, 12); ctx.fill(); }
    else { const c = COL[s.col] || s.col; tile(x, SLOT_Y + SLOT_H / 2 + 4, SLOT_W, SLOT_H - 8, s.col, s.n);
      // 壺のふちから顔をのぞかせるアリ（上向き）
      ctx.save(); ctx.translate(x, SLOT_Y + 3); ctx.rotate(-Math.PI / 2); ctx.drawImage(antSprite(s.col, 0), -16, -16, 32, 32); ctx.restore(); } }
  if (G.fast){ const k = Math.min(1, G.fastT * 4); ctx.save(); ctx.globalAlpha = k; ctx.fillStyle = '#ffb43a'; rr(HOLE.x + 50, HOLE.y - 16, 96, 32, 16); ctx.fill(); ctx.fillStyle = '#4a2a08'; ctx.font = '900 18px ' + getComputedStyle(document.body).fontFamily; ctx.textAlign = 'center'; ctx.fillText('⏩ 倍速', HOLE.x + 98, HOLE.y + 1); ctx.restore(); }
  // アリ
  const fr = Math.floor(G.time * 14) % 2;
  for (const a of G.ants){ const sp = antSprite(a.col, (fr + (a.ph > 3 ? 1 : 0)) % 2);
    ctx.save(); ctx.translate(a.x + Math.sin(G.time * 9 + a.ph) * 1.2, a.y); ctx.rotate(a.ang); if (a.st === 1) ctx.rotate(Math.sin(a.t * 60) * 0.25); ctx.drawImage(sp, -20, -20, 40, 40);
    if (a.st === 2){ const c = COL[a.col] || a.col; const s = Math.max(6, Math.min(13, G.cs * 0.7)); ctx.fillStyle = shade(c, 0.7); ctx.fillRect(-7 - s / 2, -s / 2 + 1, s + 1, s + 1); ctx.fillStyle = c; ctx.fillRect(-7 - s / 2, -s / 2, s, s); }   // 背中にかついで運ぶ（顔は隠さない）
    ctx.restore(); }
  for (const p of G.parts){ ctx.globalAlpha = 1 - p.t / 0.4; ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, p.s, p.s); } ctx.globalAlpha = 1;
  // 山札（上4段。4段目は薄く）
  for (let i = 0; i < NCOL; i++){ const st = G.stacks[i];
    for (let r = Math.min(ROWS_SHOWN, st.length) - 1; r >= 0; r--){ const t = st[r]; const y = TILE_Y + TILE_H / 2 + r * ROW_GAP + G.colOff[i];
      if (y + TILE_H / 2 > LH + 10) continue; tile(colX(i), y, TILE_W, TILE_H, t.col, t.n, r === 0 && G.colOff[i] === 0 ? 'top' : ''); }
    if (st.length > ROWS_SHOWN){ ctx.fillStyle = 'rgba(255,245,225,.8)'; ctx.font = '700 14px ' + getComputedStyle(document.body).fontFamily; ctx.textAlign = 'center'; ctx.fillText('あと' + (st.length - ROWS_SHOWN), colX(i), LH - 8); } }
  // 飛んでいる壺
  for (const f of G.flying){ const u = Math.min(1, f.t / 0.26), e = 1 - (1 - u) * (1 - u); const x = f.x0 + (f.x1 - f.x0) * e, y = f.y0 + (f.y1 - f.y0) * e - Math.sin(u * Math.PI) * 60; tile(x, y, TILE_W, TILE_H, f.col, f.n); }
}

// ---------- オーバーレイ ----------
function showOv(html){ card.innerHTML = html; ov.classList.add('on'); }
function hideOv(){ ov.classList.remove('on'); }
function showTitle(){ mode = 'title';
  // 10面ごとのチェックポイント（1・11・21…のうち到達した分）からやり直せる
  const cps = []; for (let lv = 1; lv <= bestLv; lv += 10) cps.push(lv);
  const cpHtml = bestLv > 1 ? `<div class="cps"><span class="cpl">やり直す:</span>${cps.map(lv => `<button class="cp" data-lv="${lv}">レベル${lv}</button>`).join('')}</div>` : '';
  showOv(`<div class="ants">🐜🐜🐜</div><h1>ブロックハンター</h1><p>色ごとのアリを送って、ドット絵の食べ物・乗り物・家電・名画を食べ尽くそう！</p>
    <button class="btn go" id="bCont">レベル ${bestLv} から${bestLv > 1 ? 'つづける' : 'はじめる'}</button>${cpHtml}<button class="btn sub" id="bHelp">あそびかた</button>`);
  document.getElementById('bCont').onclick = () => startLevel(bestLv, Date.now() & 0xffffff);
  card.querySelectorAll('.cp').forEach(b => { b.onclick = () => startLevel(parseInt(b.dataset.lv, 10), Date.now() & 0xffffff); });
  document.getElementById('bHelp').onclick = () => showHelp(showTitle);
}
function showHelp(back){
  showOv(`<h2>あそびかた</h2><div class="help">
    <b>①</b> 下の5列の、いちばん上の壺をタップすると上の枠に入ります（枠は5つ）。<br>
    <b>②</b> 壺からアリが出て、絵の<b>外側から届く</b>同じ色のブロックだけを食べて穴に運びます。数字は残りのアリの数。<br>
    <b>③</b> 囲まれているブロックは食べられません。5つの枠が「食べる物がない色」で埋まるとお手上げ。<br>
    <b>④</b> 全部食べたらクリア。レベルが上がるほど絵が大きく、まだらになります。<br>
    <b>⑤</b> 残りの壺が空いた枠の数以下になると、自動で枠に入ってアリが倍速になります。<br>
    <b>PC</b>は数字キー <b>1〜5</b> でも左から順に送れます。</div>
    <button class="btn go" id="bBack">もどる</button>`);
  document.getElementById('bBack').onclick = back;
}
function showClear(){
  showOv(`<div class="ants">🎉🐜🎉</div><h2>レベル ${L.lv} クリア！</h2><p>${L.name}を食べ尽くした（${L.total}ブロック・壺${G.sent}個）</p>
    <button class="btn go" id="bNext">つぎのレベルへ</button><button class="btn sub" id="bTitle">タイトルへ</button>`);
  document.getElementById('bNext').onclick = () => startLevel(L.lv + 1, Date.now() & 0xffffff);
  document.getElementById('bTitle').onclick = showTitle;
}
function showStuck(){
  showOv(`<div class="ants">😵🐜😵</div><h2>アリが詰まった！</h2><p>5つの枠がぜんぶ「食べる物がない色」になりました。</p><p class="sub">食べる物が外側に見えている色から送ると詰まりにくい。</p>
    <button class="btn go" id="bRetry">同じ並びでやり直す</button><button class="btn sub" id="bShuf">ちがう並びでやり直す</button><button class="btn sub" id="bTitle">タイトルへ</button>`);
  document.getElementById('bRetry').onclick = () => startLevel(L.lv, L.seed);
  document.getElementById('bShuf').onclick = () => startLevel(L.lv, Date.now() & 0xffffff);
  document.getElementById('bTitle').onclick = showTitle;
}

// ---------- 入力 ----------
cv.addEventListener('pointerdown', e => {
  const x = (e.clientX - offX) / scale, y = (e.clientY - offY) / scale; ac();
  if (y < 64){ if (Math.abs(x - 520) < 24 && G){ showOv(`<h2>やり直す？</h2><p>レベル ${L.lv} を最初からにします。</p><button class="btn go" id="bA">同じ並びで</button><button class="btn sub" id="bB">ちがう並びで</button><button class="btn sub" id="bT">タイトルへ</button><button class="btn sub" id="bC">つづける</button>`);
      document.getElementById('bA').onclick = () => startLevel(L.lv, L.seed); document.getElementById('bB').onclick = () => startLevel(L.lv, Date.now() & 0xffffff);
      document.getElementById('bT').onclick = showTitle; document.getElementById('bC').onclick = () => { hideOv(); mode = 'play'; }; mode = 'pause'; return; }
    if (Math.abs(x - 470) < 24){ muted = !muted; try { localStorage.setItem('bh_mute', muted ? '1' : '0'); } catch (e2) {} return; }
    if (Math.abs(x - 420) < 24 && G){ const m = mode; mode = 'pause'; showHelp(() => { hideOv(); mode = m; }); return; } }
  if (mode !== 'play') return;
  if (y >= TILE_Y - 6 && y <= TILE_Y + TILE_H + 6){ for (let i = 0; i < NCOL; i++) if (Math.abs(x - colX(i)) <= TILE_W / 2 + 4){ tapColumn(i); break; } }
});
document.addEventListener('keydown', e => { if (mode !== 'play') return; const k = parseInt(e.key, 10); if (k >= 1 && k <= 5) tapColumn(k - 1); });

// ---------- ループ ----------
let frozen = false;
function loop(ts){ const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts; if (!frozen) update(dt); draw(); requestAnimationFrame(loop); }
fit();
// ?lv=3 で指定レベルから、?auto=1 で自動プレイ（動作確認用）
const Q = new URLSearchParams(location.search);
if (Q.get('best')) bestLv = parseInt(Q.get('best'), 10) || 1;   // 動作確認用: 到達レベルを仮に設定
// 動作確認用: ?colors=76 で各面の「名前:色数:ブロック数:次の名画のブロック数」を title に出す
if (Q.get('colors')){ const n = parseInt(Q.get('colors'), 10) || 42; const out = []; for (let lv = 1; lv <= n; lv++){ const Lx = makeLevel(lv, 1); out.push(lv + ':' + Lx.name + ':' + new Set(Lx.grid.filter(v => v)).size + ':' + Lx.total + ':' + (Lx.limit == null ? '-' : Lx.limit)); } document.title = out.join(' '); }
if (Q.get('lv')){ startLevel(parseInt(Q.get('lv'), 10) || 1, parseInt(Q.get('seed') || '1', 10)); } else showTitle();
if (Q.get('auto')){ muted = true; const bot = () => { if (mode === 'play'){ let best = -1, bv = -1;
      // ふつうの人の打ち方: 届くブロックが多い色を送る。どの壺も届かないときは、アリが動いている間は待ち、止まったら「次の壺が届く列」を退かす
      const F = field(G.grid, G.W, G.H, Math.floor(G.W / 2));
      const rc = col => { let v = 0; for (let r = 0; r < G.H; r++) for (let c = 0; c < G.W; c++) if (G.grid[r * G.W + c] === col && !G.reserved[r * G.W + c] && reach(F, G.grid, G.W, G.H, c, r)) v++; return v; };
      for (let i = 0; i < NCOL; i++){ const t = G.stacks[i][0]; if (!t) continue; const v = rc(t.col); if (v > bv){ bv = v; best = i; } }
      const free = G.slots.some((s, k) => !s && !G.flying.some(f => f.slot === k));
      if (best >= 0 && free){
        if (bv > 0) tapColumn(best);
        else if (G.ants.length === 0 && G.flying.length === 0 && !G.slots.some(s => s && s.n > 0 && rc(s.col) > 0)){
          let alt = -1; for (let i = 0; i < NCOL; i++){ const u = G.stacks[i][1]; if (u && rc(u.col) > 0){ alt = i; break; } }
          tapColumn(alt >= 0 ? alt : best); } } }
    else if (mode === 'clear'){ document.title = 'CLEAR lv' + L.lv + ' sent' + G.sent + ' t' + G.time.toFixed(1); if (Q.get('next')) startLevel(L.lv + 1, 1); }
    else if (mode === 'stuck'){ document.title = 'STUCK lv' + L.lv + ' left' + G.left; } };
  if (Q.get('sync')){ // 同期的に回す（ヘッドレス確認用）: &to=13 で連続、&stopAt=6 でその時刻の画面で止める
    window.onerror = (m, s, l) => { document.title = 'ERR ' + m + ' @' + l; };
    const to = parseInt(Q.get('to') || '0', 10), stopAt = parseFloat(Q.get('stopAt') || '0'); const res = [];
    try { for (let f = 0; f < 60 * 600; f++){ if (f % 24 === 0) bot(); update(1 / 60);
        if (stopAt && G.time >= stopAt) break;
        if (mode === 'clear' || mode === 'stuck'){ res.push('lv' + L.lv + (mode === 'clear' ? ':OK' : ':STUCK left' + G.left) + ' t' + G.time.toFixed(0) + ' n' + L.total + ' ' + G.W + 'x' + G.H + ' tiles' + L.stacks.flat().length);
          if (mode === 'clear' && to && L.lv < to) startLevel(L.lv + 1, parseInt(Q.get('seed') || '1', 10)); else break; } }
      if (!stopAt) document.title = res.join(' | ') || ('RUN lv' + L.lv + ' left' + G.left + ' t' + G.time.toFixed(0)); else { hideOv(); frozen = true; } }
    catch (e) { document.title = 'ERR ' + e.message + ' ' + (e.stack || '').split('\n')[1]; }
  } else setInterval(bot, 400); }
requestAnimationFrame(loop);
})();
</script>
