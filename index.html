<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5a3b22">
<title>ブロックハンター</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="manifest" href="manifest.webmanifest?v=2">
<meta name="apple-mobile-web-app-title" content="ブロックハンター">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap">
<style>
/* ブロックハンター: 色ごとのアリの壺を送り出して、ドット絵を食べ尽くすパズル。
   画面は幅540×高さ1060の論理座標を1枚のcanvasに描き、端末の画面に収まるように拡縮する。 */
:root{
  --bg:#3b2614; --paper:#f6ead2; --ink:#2b1d10;
  --font-disp:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font-disp);color:var(--paper);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-text-size-adjust:100%}
#wrap{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#game{position:absolute;left:0;top:0;width:540px;height:1060px;transform-origin:0 0;display:block;touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}   /* スマホで壺をタップするたびに画面全体が光る（タップのハイライト）のを止める */
#ov{position:absolute;left:0;top:0;width:540px;height:1060px;box-sizing:border-box;padding:16px 0 24px;transform-origin:0 0;display:none;background:rgba(30,18,8,.72);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:thin}   /* カードが画面より高くなったら（やり直しボタンが増えたとき）指でスクロール */
#ov.on{display:flex}
#card{margin:auto;flex-shrink:0}   /* 収まるときは真ん中、はみ出すときは上から並べてスクロール（align-items:center だと上が切れてスクロールでも戻せない） */
.card{width:420px;box-sizing:border-box;padding:30px 28px 26px;border-radius:26px;background:linear-gradient(#fff8e8,#f3e2c0);color:var(--ink);text-align:center;box-shadow:0 14px 0 #8a5a2b,0 24px 40px rgba(0,0,0,.45);border:4px solid #c08a4d}
.card h1{margin:0 0 8px;font-size:42px;font-weight:900;letter-spacing:0;line-height:1.15;white-space:nowrap}   /* 「ブロックハンター」を1行に（44px だと最後の「ー」だけ2行目に落ちていた） */
.card h2{margin:0 0 10px;font-size:34px;font-weight:900;line-height:1.2}
.card p{margin:6px 0 0;font-size:19px;font-weight:700;line-height:1.5;color:#5a4330}
.card .sub{font-size:16px;color:#7b6248}
.btn{display:block;width:100%;box-sizing:border-box;margin-top:16px;padding:16px 10px;border:0;border-radius:18px;font-family:var(--font-disp);font-weight:900;font-size:26px;line-height:1;color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn.go{background:linear-gradient(#ffb43a,#f08a12);box-shadow:0 6px 0 #a85a06;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.sub{background:linear-gradient(#8fb4c9,#5f879e);box-shadow:0 6px 0 #37586b;font-size:21px;padding:13px 10px;color:#111}   /* 字は黒（色の指定が無く .card .sub の茶色が付いて読みにくかった） */
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.ants{font-size:40px;line-height:1;margin-bottom:6px}
.cps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:14px}
.cpl{font-size:16px;font-weight:700;color:#7b6248}
.cp{flex:0 0 calc((100% - 16px) / 3);box-sizing:border-box;padding:10px 0;text-align:center;border-radius:12px;border:2px solid #c08a4d;background:#fffaf0;color:#5a3b22;font-family:var(--font-disp);font-weight:900;font-size:17px;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;box-shadow:0 3px 0 #c08a4d}
.cp:active{transform:translateY(2px);box-shadow:0 1px 0 #c08a4d}
.cp:focus-visible{outline:3px solid #f08a12;outline-offset:2px}
.help{text-align:left;font-size:17px;line-height:1.55;margin:12px 0 0;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.55);color:#4a3523}
.help b{color:#c2410c}
.card p.lead{margin:6px -8px 0;font-size:17px;letter-spacing:0;white-space:nowrap}   /* タイトル下の説明は2行に収める（19pxのままだと3行になり「う！」だけ3行目に落ちていた） */
.card p.loop{margin:14px 0 0;font-size:17px;color:#7b6248}   /* くり返しの面まで来たら「あそびかた」の上に出す注意書き */
.card p.credit{margin:18px 0 0;font-size:15px;font-weight:700;color:#9a7f62;letter-spacing:.02em}   /* タイトル画面の一番下: 作った人とプロフィールページへのリンク */
/* 10面クリアごとのお祝い: 紙吹雪（画面全体・タップは下に通す）と「おめでとう！」の見出し */
#fx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5}
#fx i{position:absolute;top:-24px;display:block;border-radius:2px;animation:fall linear forwards}
@keyframes fall{0%{top:-24px;transform:translateX(0) rotate(0)}100%{top:104%;transform:translateX(var(--dx)) rotate(var(--rot))}}
.card.cele{animation:celepop .55s cubic-bezier(.2,1.6,.4,1) both;border-color:#f0b429;box-shadow:0 14px 0 #b07a12,0 0 0 6px rgba(255,214,90,.45),0 24px 40px rgba(0,0,0,.45)}
@keyframes celepop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.card .omedeto{font-size:46px;margin:0 0 2px;background:linear-gradient(90deg,#ff5a5a,#ffb43a,#3fc36a,#3f97f3,#9a5ce6);-webkit-background-clip:text;background-clip:text;color:transparent;animation:wiggle 1.2s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.06)}}
.card .medal{font-size:56px;line-height:1;margin-bottom:4px;animation:spin 1.4s ease-in-out infinite}
@keyframes spin{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-6px) rotate(8deg)}}
/* 50面ごとの豪華なお祝い（11/2 本人依頼）: 金色に光るカード＋王冠、花火、紙吹雪3倍、長いファンファーレ、カードを横切る光 */
.card.cele50{position:relative;overflow:hidden;background:linear-gradient(135deg,#fff6cf 0%,#ffd968 35%,#fff3bf 55%,#ffcc3d 100%);border-color:#ffe27a;animation:celepop .7s cubic-bezier(.2,1.6,.4,1) both,goldglow 1.4s ease-in-out .7s infinite alternate}
@keyframes goldglow{0%{box-shadow:0 14px 0 #b07a12,0 0 0 8px rgba(255,220,100,.7),0 0 40px rgba(255,200,50,.6),0 24px 40px rgba(0,0,0,.45)}100%{box-shadow:0 14px 0 #b07a12,0 0 0 12px rgba(255,230,140,.95),0 0 110px rgba(255,210,60,1),0 24px 40px rgba(0,0,0,.45)}}
.card.cele50::after{content:'';position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.85) 50%,transparent 65%);transform:translateX(-100%);animation:sheen 1.6s ease-in-out .5s 3;pointer-events:none}
@keyframes sheen{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.card .crown{font-size:84px;line-height:1;margin-bottom:2px;animation:crownjump 1s cubic-bezier(.3,1.5,.5,1) infinite}
@keyframes crownjump{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-16px) scale(1.12) rotate(-6deg)}70%{transform:translateY(-6px) scale(1.05) rotate(5deg)}}
.card .omedeto.big{font-size:48px;letter-spacing:0;white-space:nowrap}   /* 「だいせいこう！」を1行に（56pxだと「う！」が2行目に落ちた） */
.card .gold{display:inline-block;margin-top:12px;padding:8px 18px;border-radius:999px;background:linear-gradient(#ffe27a,#f0b429);color:#6b3d00;font-size:21px;font-weight:900;box-shadow:0 4px 0 #a86e0a;animation:wiggle 1.2s ease-in-out infinite}
/* 1000面クリアのお祝い（11/13 本人依頼）: 50面ごとの金色のカードに、にじ色に変わる光・トロフィーと王冠・「でんせつのハンター！」・お礼の一言を足す */
.card.cele1000{border-color:#fff;animation:celepop .8s cubic-bezier(.2,1.6,.4,1) both,rainbowglow 2.4s linear .8s infinite}
@keyframes rainbowglow{0%,100%{box-shadow:0 14px 0 #b07a12,0 0 0 10px rgba(255,90,90,.9),0 0 120px rgba(255,90,90,1),0 24px 40px rgba(0,0,0,.45)}25%{box-shadow:0 14px 0 #b07a12,0 0 0 14px rgba(255,224,60,.95),0 0 130px rgba(255,224,60,1),0 24px 40px rgba(0,0,0,.45)}50%{box-shadow:0 14px 0 #b07a12,0 0 0 10px rgba(63,195,106,.9),0 0 120px rgba(63,195,106,1),0 24px 40px rgba(0,0,0,.45)}75%{box-shadow:0 14px 0 #b07a12,0 0 0 14px rgba(63,151,243,.95),0 0 130px rgba(154,92,230,1),0 24px 40px rgba(0,0,0,.45)}}
.card.cele1000::after{animation:sheen 1.6s ease-in-out .5s infinite}
.card.cele1000 .crown{font-size:70px;white-space:nowrap}
.card .omedeto.legend{font-size:35px;letter-spacing:0;white-space:nowrap}
.card p.thanks{margin:14px 0 0;font-size:19px;font-weight:900;color:#8a4b00}
#fx b{position:absolute;width:11px;height:11px;border-radius:50%;opacity:0;box-shadow:0 0 10px 3px currentColor;animation:burst var(--d) cubic-bezier(.1,.8,.3,1) var(--delay) forwards}   /* 花火の粒（開く前は見えない。光らせて紙吹雪に埋もれないように） */
@keyframes burst{0%{transform:translate(0,0) scale(1.6);opacity:1}70%{opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(.5);opacity:0}}
#fx s{position:absolute;font-size:28px;text-decoration:none;animation:twinkle 1.1s ease-in-out var(--delay) infinite}   /* きらきら */
@keyframes twinkle{0%,100%{transform:scale(.4) rotate(0);opacity:.2}50%{transform:scale(1.3) rotate(25deg);opacity:1}}
.credit a{color:#c2410c;text-decoration:underline;text-underline-offset:3px;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="540" height="1060"></canvas>
  <div id="ov"><div class="card" id="card"></div></div>
  <div id="fx"></div>
</div>
<script>
(() => {
'use strict';
const LW = 540, LH = 1060;              // 論理座標
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const ov = document.getElementById('ov');
const card = document.getElementById('card');
const DPR = Math.min(2, window.devicePixelRatio || 1);
let scale = 1, offX = 0, offY = 0;

function fit(){
  const vw = window.innerWidth, vh = window.innerHeight;
  scale = Math.min(vw / LW, vh / LH);
  offX = Math.floor((vw - LW * scale) / 2);
  offY = Math.floor((vh - LH * scale) / 2);
  const tf = `translate(${offX}px,${offY}px) scale(${scale})`;
  cv.style.transform = tf; ov.style.transform = tf;
  cv.width = Math.round(LW * DPR); cv.height = Math.round(LH * DPR);
  cv.style.width = LW + 'px'; cv.style.height = LH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  boardDirty = true;
}
window.addEventListener('resize', fit);

// ---------- 乱数（レベルごとに同じ並びを再現できるように seed 付き） ----------
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = Math.random;

// ---------- 色（ビーズ風の明るい色。各色に名前を付けてアリの色にも使う） ----------
// 10/27 黒と紺・黄とオレンジが見分けにくいと指摘 → 黒を濃く、紺を鮮やかな青紫寄りに、黄をレモン寄りに、オレンジを赤寄りに。灰色2段も離した
const COL = {
  red:'#ec4a3c', dkred:'#9c1430', orange:'#f58a1f', yellow:'#ffe03c', green:'#52d05a', dkgreen:'#237f33',
  blue:'#3f97f3', lblue:'#74d4f6', purple:'#9a5ce6', pink:'#f792b8', brown:'#a0682c', dkbrown:'#73300e',
  lbrown:'#dcaa72', tan:'#e8cc93', white:'#fbf8f1', black:'#242424', mint:'#7de8c9', salmon:'#ff9c7a', cream:'#fdeba0',
  gray:'#a6adb5', dkgray:'#5c6673', navy:'#2d4dc2', dkorange:'#b8420a'
};
const rgbOf = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const colorDist = (a, b) => { const p = rgbOf(a), q = rgbOf(b); return Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]); };
const lumOf = h => { const [r, g, b] = rgbOf(h); return 0.3 * r + 0.59 * g + 0.11 * b; };
// 見分けやすさの指標: Lab の色差。ただし暗い色どうしは色味（a・b）の違いが見えにくいので、2色の明るさに応じて a・b の重みを下げる（黒と紺のように RGB では離れていても見分けにくい組を拾う）
const labOf = h => { const f = v => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  const [r, g, b] = rgbOf(h).map(f); const X = (0.4124 * r + 0.3576 * g + 0.1805 * b) / 0.95047, Y = 0.2126 * r + 0.7152 * g + 0.0722 * b, Z = (0.0193 * r + 0.1192 * g + 0.9505 * b) / 1.08883;
  const t = v => v > 0.008856 ? Math.cbrt(v) : 7.787 * v + 16 / 116; const fx = t(X), fy = t(Y), fz = t(Z); return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)]; };
const vdist = (a, b) => { const p = labOf(a), q = labOf(b); const c = Math.max(0.45, Math.min(1, (p[0] + q[0]) / 100)); return Math.hypot(p[0] - q[0], c * (p[1] - q[1]), c * (p[2] - q[2])); };
const SEE = 30;   // これ以上離れていれば別の色として見分けがつく（陰影・輪郭線で作る色はすべてこの基準で選ぶ。元の RGB 距離52より厳しい）
// 「見分けがつく」の判定: 色差 SEE 以上で、かつ 明るさの差20以上／鮮やかさの差35以上／片方が無彩色でもう片方が鮮やか／色相が40度以上ちがう のどれか（同じ色相で明るさが少し違うだけの2色＝オリーブ2色などを弾く）
// 鮮やかさも暗い色では見えにくいので vdist と同じ重みを掛けて比べる（旧パレットの黒と紺はこれで「見分けにくい」と判定される）
function distinct(a, b){
  const p = labOf(a), q = labOf(b); if (Math.abs(p[0] - q[0]) >= 25) return true;   // 明るさが25以上ちがえば無条件（灰色の段と同じ）
  if (vdist(a, b) < SEE) return false;
  const c = Math.max(0.45, Math.min(1, (p[0] + q[0]) / 100)), cp = c * Math.hypot(p[1], p[2]), cq = c * Math.hypot(q[1], q[2]);
  if (Math.abs(p[0] - q[0]) >= 20 || Math.abs(cp - cq) >= 35) return true;
  if (Math.min(cp, cq) < 12) return Math.max(cp, cq) >= 30;
  let dh = Math.abs(Math.atan2(p[2], p[1]) - Math.atan2(q[2], q[1])) * 180 / Math.PI; if (dh > 180) dh = 360 - dh;
  return dh >= 40 && Math.min(cp, cq) >= 18;
}
const hslOf = hex => { const [r, g, b] = rgbOf(hex).map(v => v / 255); const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2; if (mx === mn) return [0, 0, l];
  const d = mx - mn, s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn); const h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; return [h * 60, s, l]; };
const hexOfHsl = (h, s, l) => { h = (((h % 360) + 360) % 360) / 360; const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const f = t => { t = ((t % 1) + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 0.5 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
  return '#' + [f(h + 1 / 3), f(h), f(h - 1 / 3)].map(v => Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, '0')).join(''); };
// 濃さを k 倍にしたうえで色相を amt 度ずらす（影は青寄り・光は黄寄り＝ドット絵の定石。同系に見えたまま見分けやすくなる）。無彩色は代わりに薄く色を付ける（影は青みのグレー、光は黄みのグレー）
function tint(hex, k, amt, dark){
  if (!amt) return shade(hex, k);
  const base = shade(hex, k), lc = labOf(base); let [h, s, l] = hslOf(base);
  if (Math.hypot(lc[1], lc[2]) < 12){ h = dark ? 225 : 48; s = Math.min(0.32, 0.08 + amt / 60); }   // 無彩色の判定は Lab の鮮やかさで（HSL の s は白に近いと大きく出る）
  else { const dir = dark ? (h >= 45 && h < 240 ? 1 : -1) : (h > 60 && h <= 240 ? -1 : 1); h += dir * amt;
    s = Math.min(1, s * (dark ? Math.min(1.5, 1 + amt / 60) : 1 - amt / 120)); }
  return hexOfHsl(h, s, l);
}
// 既存の色と見分けがつく（vdist が SEE 以上）いちばん控えめな「同系の別の濃さ」を1つ返す。dir: 'dark' | 'light' | 省略＝明るい色は暗く、暗い色は明るく
function variantColor(hex, used, dir){
  const lum = lumOf(hex) / 255, lh = labOf(hex), neutral = Math.hypot(lh[1], lh[2]) < 12;   // 白・灰・黒は濃淡だけでは見分けにくい（白と灰と黒の間に2色は入らない）ので、最初から色味を付ける
  // 候補は控えめな順。どれも見分けがつかなければ null＝その色の陰影は付けない（10/27 本人指示: 色相を大きくずらした「保険の色」はやめて、その分は色を付けない＝少し易しくなる）
  const dark = (neutral ? [[0.72, 12], [0.62, 18], [0.5, 24], [0.4, 30], [0.3, 36]] : [[0.72, 0], [0.62, 12], [0.5, 18], [0.4, 24], [0.3, 30]]).map(([k, a]) => tint(hex, k, a, true));
  const light = (neutral ? [[1.3, 12], [1.45, 18], [1.65, 24], [1.9, 30], [2.2, 36]] : [[1.3, 0], [1.45, 10], [1.65, 15], [1.9, 20], [2.2, 25]]).map(([k, a]) => tint(hex, k, a, false));
  const ks = dir === 'dark' ? dark : dir === 'light' ? light : lum > 0.55 ? [dark[0], dark[1], light[0], dark[2], light[1], dark[3], dark[4]] : [light[0], light[1], dark[0], light[2], light[3], dark[1], light[4]];
  return ks.find(c => used.every(u => distinct(u, c))) || null;
}
function shade(hex, k){ // k<1 で暗く、>1 で明るく
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = v => Math.max(0, Math.min(255, Math.round(k >= 1 ? v + (255 - v) * (k - 1) : v * k)));
  return '#' + ((f(r) << 16) | (f(g) << 8) | f(b)).toString(16).padStart(6, '0');
}

// ---------- ドット絵の描画（デザイン座標 → セルに塗る） ----------
// 形は順番に塗り重ねる（後のものが上）。色 0 は消しゴム。
function Pic(){ this.sh = []; this.post = []; }
Pic.prototype = {
  c(x, y, r, col){ this.sh.push({ t: 'c', x, y, r, col }); return this; },
  e(x, y, rx, ry, col){ this.sh.push({ t: 'e', x, y, rx, ry, col }); return this; },
  r(x0, y0, x1, y1, col){ this.sh.push({ t: 'r', x0, y0, x1, y1, col }); return this; },
  p(pts, col){ this.sh.push({ t: 'p', pts, col }); return this; },
  l(x0, y0, x1, y1, w, col){ this.sh.push({ t: 'l', x0, y0, x1, y1, w, col }); return this; },
  seeds(col, sx, sy, ox, oy, onlyCol){ this.post.push({ t: 'seeds', col, sx, sy, ox, oy, onlyCol }); return this; },
  hit(s, x, y){
    switch (s.t){
      case 'c': { const dx = x - s.x, dy = y - s.y; return dx * dx + dy * dy <= s.r * s.r; }
      case 'e': { const dx = (x - s.x) / s.rx, dy = (y - s.y) / s.ry; return dx * dx + dy * dy <= 1; }
      case 'r': return x >= s.x0 && x <= s.x1 && y >= s.y0 && y <= s.y1;
      case 'l': { const dx = s.x1 - s.x0, dy = s.y1 - s.y0, L = dx * dx + dy * dy || 1;
        let t = ((x - s.x0) * dx + (y - s.y0) * dy) / L; t = Math.max(0, Math.min(1, t));
        const px = s.x0 + t * dx - x, py = s.y0 + t * dy - y; return px * px + py * py <= s.w * s.w / 4; }
      case 'p': { const p = s.pts; let inside = false;
        for (let i = 0, j = p.length - 1; i < p.length; j = i++){
          const xi = p[i][0], yi = p[i][1], xj = p[j][0], yj = p[j][1];
          if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
        } return inside; }
    } return false;
  },
  // bw×bh のデザイン座標を k 倍のセル数に描く
  raster(bw, bh, k){
    const W = Math.round(bw * k), H = Math.round(bh * k), g = new Array(W * H).fill(0);
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++){
      const x = (c + 0.5) / k, y = (r + 0.5) / k; let col = 0;
      for (const s of this.sh) if (this.hit(s, x, y)) col = s.col;
      g[r * W + c] = col;
    }
    for (const q of this.post){
      if (q.t === 'seeds'){
        for (let r = 0; r < H; r++) for (let c = 0; c < W; c++){
          const x = (c + 0.5) / k, y = (r + 0.5) / k, i = r * W + c;
          if (!g[i] || (q.onlyCol && g[i] !== q.onlyCol)) continue;
          const u = (x - q.ox) / q.sx, v = (y - q.oy) / q.sy;
          const fu = u - Math.round(u), fv = v - Math.round(v);
          if (Math.abs(fu) * q.sx * k < 0.5 && Math.abs(fv) * q.sy * k < 0.5) g[i] = q.col;
        }
      }
    }
    return { W, H, g };
  }
};

// 50面ごとの特別な面: まさとパパ。デザインは48マス角（k＝上限/48）。用意してある大きさ（48・56・64・70・80・100・114・133）はそのまま、それ以外は70から最近傍で縮める（上限を変えたら tools/masato_grid.py の SIZES に足して作り直す）
const MASATO_EVERY = 50;
const MASATO = { name:'まさとパパ', bw:48, bh:48, masato:true, draw(){}, grids(k){
  const N = Math.max(4, Math.round(48 * k)), src = MASATO_GRIDS[N] || MASATO_GRIDS[70], M = src.length, g = new Array(N * N).fill(0);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){ const ch = src[Math.floor((r + 0.5) * M / N)][Math.floor((c + 0.5) * M / N)]; if (ch !== '.') g[r * N + c] = MASATO_PAL[ch]; }
  return { W: N, H: N, g }; } };
function rasterPic(p, k){ if (p.grids) return p.grids(k); const P = new Pic(); p.draw(P); return P.raster(p.bw, p.bh, k); }
function blockCount(g){ let n = 0; for (const v of g) if (v) n++; return n; }

// 陰影は「絵の縁ぞい」に付ける（暗い色なら右下側の影、明るい色なら左上側の光）。面積はその色の約4分の1まで＝半分にすると何の絵かわからなくなる（パンダなど）ため
function applyDetail(g, W, H, d){
  if (!d) return g;
  const cnt = {}; for (const v of g) if (v) cnt[v] = (cnt[v] || 0) + 1;
  const order = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]); const used = order.map(k => COL[k] || k);
  const diag = i => (i % W + 0.5) / W + (Math.floor(i / W) + 0.5) / H;   // 0（左上）〜2（右下）
  // 輪郭線（d3以上）になるセル＝絵の外に接するセル。陰影はその内側に付ける
  const edge = new Set();
  if (d >= 3) for (let r = 0; r < H; r++) for (let c = 0; c < W; c++){ const i = r * W + c; if (!g[i]) continue;
    for (const [dc, dr] of [[1,0],[-1,0],[0,1],[0,-1]]){ const cc = c + dc, rr = r + dr; if (cc < 0 || rr < 0 || cc >= W || rr >= H || !g[rr * W + cc]){ edge.add(i); break; } } }

// q[0]〜q[qt-1]（vis 済みのマス）から、通れるマスへ vis を広げる
function floodReach(g, W, H, vis, q, qt){
  const GW = W + 2; let qh = 0;
  while (qh < qt){
    const i = q[qh++], c = i % GW, r = (i - c) / GW;
    const rowIn = r >= 1 && r <= H, colIn = c >= 1 && c <= W;   // 絵のある行・列（それ以外はリング＝必ず通れる）
    if (c > 0 && !vis[i - 1] && (!rowIn || c === 1 || g[(r - 1) * W + c - 2] === 0)){ vis[i - 1] = 1; q[qt++] = i - 1; }
    if (c < GW - 1 && !vis[i + 1] && (!rowIn || c === W || g[(r - 1) * W + c] === 0)){ vis[i + 1] = 1; q[qt++] = i + 1; }
    if (r > 0 && !vis[i - GW] && (!colIn || r === 1 || g[(r - 2) * W + c - 1] === 0)){ vis[i - GW] = 1; q[qt++] = i - GW; }
    if (r <= H && !vis[i + GW] && (!colIn || r === H || g[r * W + c - 1] === 0)){ vis[i + GW] = 1; q[qt++] = i + GW; }
  }
}
// vis に隣接するブロックを色ごとに集める（左上から順）
function collectReach(g, W, H, vis){
  const GW = W + 2, m = {};
  for (let r = 0; r < H; r++){ const ro = r * W, rg = (r + 1) * GW + 1;
    for (let c = 0; c < W; c++){ const v = g[ro + c]; if (!v) continue; const i = rg + c;
      if (vis[i - 1] || vis[i + 1] || vis[i - GW] || vis[i + GW]){ const a = m[v]; if (a) a.push(ro + c); else m[v] = [ro + c]; } } }
  return m;
}
// 遊んで解けるかの簡易チェック。aggressive=false: 届く分を食べ切ってから次を選ぶ慎重な打ち方／true: 空き枠があれば届く色の壺をすぐ入れるせっかちな打ち方
// mode: 'careful'＝届く分を食べ切ってから次を選ぶ／'aggressive'＝空き枠があれば届く色の壺をすぐ入れる／'interleave'＝少し食べては壺を送る（実際の遊びの時間差に近い）。R があれば届く色の中からランダムにも選ぶ
function simulate(grid, W, H, stacks0, mode, R){
  const g = grid.slice(); const st = stacks0.map(s => s.map(t => ({ col: t.col, n: t.n })));
  let slots = []; let left = blockCount(g); let guard = 0;
  // 届く一覧の計算は面の生成でいちばん時間がかかる所。ブロックは減る一方で、食べるのは必ず届くブロックなので、届く範囲は食べた所から広げるだけでよい（盤面が変わっていなければ計算しない）
  const GW = W + 2, vis = new Uint8Array(GW * (H + 2)), q = new Int32Array(GW * (H + 2)); let qn = 1, cur = null;
  q[0] = (H + 1) * GW + Math.floor(W / 2) + 1; vis[q[0]] = 1;
  const reachNow = () => { if (!cur){ floodReach(g, W, H, vis, q, qn); qn = 0; cur = collectReach(g, W, H, vis); } return cur; };
  const bestTop = m => { let best = -1, bv = -1; const ok = [];
    for (let i = 0; i < NCOL; i++){ const t = st[i][0]; if (!t) continue; const v = (m[t.col] || []).length; if (v > 0) ok.push([i, v]); if (v > bv){ bv = v; best = i; } }
    if (R && ok.length && R() < 0.6){ const [i, v] = ok[Math.floor(R() * ok.length)]; return [i, v]; } return [best, bv]; };
  while (left > 0 && guard++ < 8000){
    let m = reachNow();
    if (mode === 'aggressive'){ while (slots.length < NSLOT){ const [b, v] = bestTop(m); if (b < 0 || v <= 0) break; slots.push(st[b].shift()); } }
    else if (mode === 'interleave' && slots.length < NSLOT){ const [b, v] = bestTop(m); if (b >= 0 && v >= Math.max(2, 0.3 * st[b][0].n)) slots.push(st[b].shift()); }   // 1回に1個だけ、その壺の3割以上が届くときに送る（ふつうの人の感覚）
    let moved = true, ate = false;
    while (moved){ moved = false; m = reachNow();
      for (const s of slots){ if (s.n <= 0) continue; const rs = m[s.col] || []; if (!rs.length) continue;
        let take = Math.min(s.n, rs.length); if (mode === 'interleave') take = Math.max(1, Math.min(take, Math.ceil(rs.length * (0.2 + 0.8 * (R ? R() : 0.5)))));
        for (let j = 0; j < take; j++){ const b = rs[j]; g[b] = 0; const i = (Math.floor(b / W) + 1) * GW + b % W + 1; vis[i] = 1; q[qn++] = i; } cur = null;
        m[s.col] = rs.slice(take); s.n -= take; left -= take; moved = true; ate = true; }   // 同じ色の壺が2つ枠にあるとき、食べた分を2重に数えない
      slots = slots.filter(s => s.n > 0);
      if (mode === 'interleave' && moved) break;
    }
    if (left <= 0) return true;
    if (mode === 'interleave' && ate) continue;
    m = reachNow(); let [best, bv] = bestTop(m);
    const fail = () => { simulate.fail = { mode, left, slots: slots.map(s => s.col + 'x' + s.n), reach: Object.keys(m).map(c => c + ':' + m[c].length), tops: st.map(s => s.slice(0, 2).map(t => t.col + 'x' + t.n).join('/')) }; return false; };   // 動作確認用: 詰んだときの状態
    if (best < 0) return fail();
    if (bv === 0){ // 届く色が無い: 空き枠があれば次の壺が届く色の列を1つ退かす
      if (slots.length >= NSLOT) return fail();
      let alt = -1; for (let i = 0; i < NCOL; i++){ const u = st[i][1]; if (u && (m[u.col] || []).length > 0){ alt = i; break; } }
      best = alt >= 0 ? alt : best;

  }

}
// 慎重・せっかち（空き枠を全部すぐ埋める）・少しずつ の3通り＋ランダム混じり3通りで解ける並びだけ通す
function solvable(grid, W, H, stacks, R){
  for (const m of ['careful', 'aggressive', 'interleave']) if (!simulate(grid, W, H, stacks, m)) return false;
  for (const m of ['careful', 'aggressive', 'interleave']) if (!simulate(grid, W, H, stacks, m, R)) return false;   // ランダム混じりの打ち方3通り
  return true;
}

function makeLevel(lv, seed, dOverride){
  const spec = levelSpec(lv); const R = mulberry32(seed); if (dOverride != null) spec.detail = dOverride;
  let k = spec.k, ras = rasterPic(spec.food, k);
  // 次に出る名画のブロック数以上になっていたら、基準サイズまでの範囲で少しずつ縮める
  while (spec.limit != null && blockCount(ras.g) >= spec.limit && k > spec.baseK + 1e-6){ k = Math.max(spec.baseK, k - 0.02); ras = rasterPic(spec.food, k); }
  const { W, H, g } = ras;
  applyDetail(g, W, H, spec.detail);   // 濃淡・輪郭線・網点で絵を複雑にする（色も増える）
  spec.chunk = Math.max(spec.chunk, blockCount(g) / (spec.potMax || 36));   // 大きい絵でも壺が36個（100マスの周は56個・114マスは73個・133マスは75個）を超えないように
  // まだら: 塗ってあるセルの一部を絵の中の別の色に置き換える（外周2マスは触らない＝輪郭を残す）
  if (spec.noise > 0){
    const cols = [...new Set(g.filter(v => v))];
    for (let i = 0; i < g.length; i++) if (g[i] && R() < spec.noise){ const c = i % W, r = Math.floor(i / W);
      let edge = false; for (const [dc, dr] of [[1,0],[-1,0],[0,1],[0,-1]]){ const cc = c + dc, rr = r + dr; if (cc < 0 || rr < 0 || cc >= W || rr >= H || !g[rr * W + cc]) edge = true; }
      if (!edge) g[i] = cols[Math.floor(R() * cols.length)]; }
  }
  spec.layer = peelOrder(g, W, H);   // 絵はここで確定（以降の作り直しで使い回す）
  let stacks = null;
  let tries = 0, valid = true;
  for (; tries < 40; tries++){
    const sp = Object.assign({}, spec, { shuffle: Math.max(0, spec.shuffle - Math.floor(tries / 5)) });
    const s = buildStacks(g, W, H, sp, R);
    if (solvable(g, W, H, s, R)){ stacks = s; break; }
  }
  // どの並びでも通らない絵は、複雑さを1段下げて作り直す（0でも通らなければ最後の並びで出す）
  if (!stacks){ if (spec.detail > 0) return makeLevel(lv, seed, spec.detail - 1); valid = false; stacks = buildStacks(g, W, H, Object.assign({}, spec, { shuffle: 0 }), R); }

}
// ---------- 画面の配置（論理座標） ----------

const HOLE = { x: 270, y: 598, rx: 36, ry: 20 };

// 同日さらに本人指示「今の速度を基準に、300面以降は50面ごとに少しずつ上げる。上限は同じ」: 199面まで基準・200〜299面は 7.47匹・1.26倍のまま、300面から50面ごとに +0.4匹/秒・+7%（11段）で、800面〜 11.87匹・2.03倍（上限は同じ）。400面〜・600面〜の大きな段はなくした

const DISPATCH_UP_LV = 200;
const speedStep = lv => lv < 300 ? 0 : Math.min(11, Math.floor((lv - 300) / 50) + 1);   // 300面からの段（0〜11）
const dispatchRate = lv => 6 + (lv < DISPATCH_UP_LV ? 0 : 4.4 / 3 + 0.4 * speedStep(lv));   // 壺1つから毎秒何匹（200面以降）

// ---------- ゲーム状態 ----------
let L = null;                    // 今のレベル（makeLevel の結果）
let G = null;                    // 進行中の状態
let boardDirty = true, bc = null, bcx = null;
let sprites = new Map();
let muted = false; try { muted = (localStorage.getItem('bh_mute') || localStorage.getItem('fh_mute')) === '1'; } catch (e) {}
let bestLv = 1; try { bestLv = Math.max(1, parseInt(localStorage.getItem('bh_level') || localStorage.getItem('fh_level') || '1', 10) || 1); } catch (e) {}   // fh_ は旧名のころの保存（引き継ぐ）
let mode = 'title';              // title / play / clear / stuck
let updatePending = false;       // 新しい版が公開されていたら true（タイトル画面で読み込み直す）
let now = 0, last = 0;

function startLevel(lv, seed){
  L = makeLevel(lv, seed);
  const fit = Math.min((PLATE.w - PLATE.pad * 2) / L.W, (PLATE.h - PLATE.pad * 2) / L.H);
  const cs = fit >= 4 ? Math.floor(fit) : Math.floor(fit * 2) / 2;   // 4px未満（114マス〜）は0.5px刻み（11/15）
  const px0 = PLATE.x + Math.round((PLATE.w - cs * L.W) / 2), py0 = PLATE.y + Math.round((PLATE.h - cs * L.H) / 2);

    slots: Array.from({ length: NSLOT }, () => null),   // {col,n,tNext,sx,F,dirty,arr}
    reserved: new Uint8Array(L.W * L.H), ants: [], parts: [], flying: [], colOff: new Array(NCOL).fill(0),

}
// 到達レベルを保存（始めた面。クリアしたら次の面＝タイトルに戻っても次の面から始まる）
function saveBest(lv){ if (lv > bestLv) bestLv = lv; try { localStorage.setItem('bh_level', String(bestLv)); } catch (e) {} }
const cellPx = (c, r) => [G.px0 + (c + 0.5) * G.cs, G.py0 + (r + 0.5) * G.cs];
const idxPx = (F, i) => cellPx(i % F.GW - 1, Math.floor(i / F.GW) - 1);

function markGridChanged(){ boardDirty = true; G.retDirty = true; for (const s of G.slots) if (s) s.dirty = true; }

// 帰り道用: 穴へ最短で戻るための距離場。絵の下のリング（どの列でもよい）を出口にし、
// 出口から穴までの直線距離をそのセルの初期コストにしたダイクストラ（マス単位）。
function retField(grid, W, H){
  const GW = W + 2, GH = H + 2, N = GW * GH;
  const dist = new Float32Array(N).fill(Infinity), par = new Int32Array(N).fill(-1);
  const pass = i => { const c = i % GW - 1, r = Math.floor(i / GW) - 1; return c < 0 || r < 0 || c >= W || r >= H || grid[r * W + c] === 0; };
  const hp = []; // 2分ヒープ [cost, idx]
  const push = (d, i) => { hp.push([d, i]); let k = hp.length - 1; while (k > 0){ const p = (k - 1) >> 1; if (hp[p][0] <= hp[k][0]) break; [hp[p], hp[k]] = [hp[k], hp[p]]; k = p; } };
  const pop = () => { const top = hp[0], e = hp.pop(); if (hp.length){ hp[0] = e; let k = 0; for (;;){ let l = 2 * k + 1, r = l + 1, m = k; if (l < hp.length && hp[l][0] < hp[m][0]) m = l; if (r < hp.length && hp[r][0] < hp[m][0]) m = r; if (m === k) break; [hp[m], hp[k]] = [hp[k], hp[m]]; k = m; } } return top; };
  for (let c = -1; c <= W; c++){ const i = (H + 1) * GW + (c + 1); const [x, y] = cellPx(c, H); dist[i] = Math.hypot(x - HOLE.x, y - HOLE.y) / G.cs; push(dist[i], i); }
  while (hp.length){ const [d, i] = pop(); if (d > dist[i]) continue;
    const c = i % GW, r = Math.floor(i / GW); const nb = [];
    if (c > 0) nb.push(i - 1); if (c < GW - 1) nb.push(i + 1); if (r > 0) nb.push(i - GW); if (r < GH - 1) nb.push(i + GW);
    for (const j of nb){ if (!pass(j)) continue; if (dist[j] > d + 1){ dist[j] = d + 1; par[j] = i; push(dist[j], j); } } }
  return { dist, par, GW, GH };
}
function returnPath(c, r){
  if (G.retDirty || !G.ret){ G.ret = retField(G.grid, G.W, G.H); G.retDirty = false; }
  const R = G.ret; let j = (r + 1) * R.GW + (c + 1); if (!(R.dist[j] < Infinity)) return null;
  const back = []; for (; j >= 0; j = R.par[j]) back.push(idxPx(R, j));
  back.push([HOLE.x + (rnd() - 0.5) * 20, HOLE.y]); return back;
}

// 壺（枠）からアリを1匹送り出す
function dispatch(s, si){
  if (s.dirty || !s.F){ s.F = field(G.grid, G.W, G.H, s.sx); s.dirty = false; }
  let best = Infinity, bc = -1, br = -1, bi = -1;
  for (let r = 0; r < G.H; r++) for (let c = 0; c < G.W; c++){
    const i = r * G.W + c; if (G.grid[i] !== s.col || G.reserved[i]) continue;
    const q = reach(s.F, G.grid, G.W, G.H, c, r); if (q && q[0] < best){ best = q[0]; bc = c; br = r; bi = q[1]; }
  }
  if (bc < 0) return false;

  const cells = []; for (let j = bi; j >= 0; j = s.F.par[j]) cells.push(j); cells.reverse();
  const path = [[colX(si), SLOT_Y + 6]]; for (const j of cells) path.push(idxPx(s.F, j)); path.push(cellPx(bc, br));
  const back = []; for (let j = cells.length - 1; j >= 0; j--) back.push(idxPx(s.F, cells[j])); back.push([HOLE.x + (rnd() - 0.5) * 20, HOLE.y]);
  const a = { col: s.col, x: path[0][0], y: path[0][1], path, back, i: 1, st: 0, t: 0, ang: -Math.PI / 2, ph: rnd() * 6.28, c: bc, r: br, sp: SPD * walkMul(L.lv) * (0.9 + rnd() * 0.25) };

}

function updateAnts(dt){
  const A = G.ants;

    const a = A[k]; a.t += dt;
    if (a.st === 1){ if (a.t > 0.2){ a.st = 2; a.path = a.back; a.i = 0; a.t = 0; } continue; }
    let step = a.sp * dt;
    while (step > 0 && a.i < a.path.length){
      const [tx, ty] = a.path[a.i]; const dx = tx - a.x, dy = ty - a.y, d = Math.hypot(dx, dy);
      if (d <= step){ a.x = tx; a.y = ty; step -= d; a.i++; }
      else { a.x += dx / d * step; a.y += dy / d * step; const ta = Math.atan2(dy, dx); let da = ta - a.ang; da = Math.atan2(Math.sin(da), Math.cos(da)); a.ang += da * Math.min(1, dt * 14); step = 0; }
    }
    if (a.i >= a.path.length){

  document.title = 'lv' + lv + ' ' + spec.food.name + ' d' + spec.detail + ' n' + blockCount(g) + ' ' + out.join(' '); }
// 動作確認用: ?colors=76 で各面の「名前:色数:ブロック数:次の名画のブロック数」を title に出す
// ?palette=87: 各面で実際に使う色（陰影・輪郭線込み）のうち、いちばん見分けにくい2色とその距離（vdist）、distinct に通らない組の数と最初の組（元の絵の設計で同系2色を使っている所は残る）、全色
if (Q.get('palette')){ const n = parseInt(Q.get('palette'), 10) || 42; const out = []; for (let lv = 1; lv <= n; lv++){ const Lx = makeLevel(lv, 1); const cs = [...new Set(Lx.grid.filter(v => v))].map(v => COL[v] || v); let mn = 999, pr = '', nf = 0, fp = '';
  for (let i = 0; i < cs.length; i++) for (let j = i + 1; j < cs.length; j++){ const dd = vdist(cs[i], cs[j]); if (dd < mn){ mn = dd; pr = cs[i] + '/' + cs[j]; } if (!distinct(cs[i], cs[j])){ nf++; fp = fp || cs[i] + '/' + cs[j]; } }
  out.push(lv + ':' + Lx.name + ':' + cs.length + ':' + mn.toFixed(0) + ':' + pr + ':F' + nf + (fp ? '=' + fp : '') + ':' + cs.join(',')); } document.title = out.join(' '); }
if (Q.get('colors')){ const n = parseInt(Q.get('colors'), 10) || 42; const out = []; for (let lv = parseInt(Q.get('from') || '1', 10) || 1; lv <= n; lv++){ const Lx = makeLevel(lv, 1); out.push(lv + ':' + Lx.name + ':' + new Set(Lx.grid.filter(v => v)).size + ':' + Lx.total + ':' + (Lx.limit == null ? '-' : Lx.limit) + ':d' + Lx.detail + ':' + Lx.W + 'x' + Lx.H + ':t' + Lx.tries + (Lx.valid ? '' : 'X') + (applyDetail.noOutline ? 'N' : '')); } document.title = out.join(' '); }   // N＝輪郭線の色が取れなかった面
if (Q.get('lv')){ startLevel(parseInt(Q.get('lv'), 10) || 1, parseInt(Q.get('seed') || '1', 10)); } else showTitle();
if (Q.get('clear')){ startLevel(parseInt(Q.get('clear'), 10), 1); G.won = true; mode = 'clear'; showClear(); }   // 動作確認用: その面のクリア画面をすぐ出す（?clear=50 で50面ごとの豪華なお祝い、?clear=1000 で1000面のお祝い）
if (Q.get('auto')){ muted = true; const bot = () => { if (mode === 'play'){ let best = -1, bv = -1;
      // ふつうの人の打ち方: 届くブロックが多い色を送る。どの壺も届かないときは、アリが動いている間は待ち、止まったら「次の壺が届く列」を退かす
      const F = field(G.grid, G.W, G.H, Math.floor(G.W / 2));
      const rc = col => { let v = 0; for (let r = 0; r < G.H; r++) for (let c = 0; c < G.W; c++) if (G.grid[r * G.W + c] === col && !G.reserved[r * G.W + c] && reach(F, G.grid, G.W, G.H, c, r)) v++; return v; };
      for (let i = 0; i < NCOL; i++){ const t = G.stacks[i][0]; if (!t) continue; const v = rc(t.col); if (v > bv){ bv = v; best = i; } }
      const free = G.slots.some((s, k) => !s && !G.flying.some(f => f.slot === k));
      if (best >= 0 && free){
        if (bv > 0) tapColumn(best);
        else if (G.ants.length === 0 && G.flying.length === 0 && !G.slots.some(s => s && s.n > 0 && rc(s.col) > 0)){
          let alt = -1; for (let i = 0; i < NCOL; i++){ const u = G.stacks[i][1]; if (u && rc(u.col) > 0){ alt = i; break; } }
          tapColumn(alt >= 0 ? alt : best); } } }
    else if (mode === 'clear'){ document.title = 'CLEAR lv' + L.lv + ' sent' + G.sent + ' t' + G.time.toFixed(1); if (Q.get('next')) startLevel(L.lv + 1, 1); }
    else if (mode === 'stuck'){ document.title = 'STUCK lv' + L.lv + ' left' + G.left; } };
  if (Q.get('sync')){ // 同期的に回す（ヘッドレス確認用）: &to=13 で連続、&stopAt=6 でその時刻の画面で止める
    window.onerror = (m, s, l) => { document.title = 'ERR ' + m + ' @' + l; };
    const to = parseInt(Q.get('to') || '0', 10), stopAt = parseFloat(Q.get('stopAt') || '0'); const res = [];
    try { for (let f = 0; f < 60 * 600; f++){ if (f % 24 === 0) bot(); update(1 / 60);
        if (stopAt && G.time >= stopAt) break;
        if (mode === 'clear' || mode === 'stuck'){ res.push('lv' + L.lv + (mode === 'clear' ? ':OK' : ':STUCK left' + G.left) + ' t' + G.time.toFixed(0) + ' n' + L.total + ' ' + G.W + 'x' + G.H + ' tiles' + L.stacks.flat().length);
          if (mode === 'stuck' && Q.get('dbg')){ const m = reachAll(G.grid, G.W, G.H), rem = {}; for (const v of G.grid) if (v) rem[v] = (rem[v] || 0) + 1;   // 動作確認用: 詰んだときの枠・残り・届く数
            res.push('slots=' + G.slots.map(s => s ? s.col + 'x' + s.n : '-').join(',') + ' remain=' + Object.keys(rem).map(c => c + ':' + rem[c] + '/' + ((m[c] || []).length)).join(',') + ' tops=' + G.stacks.map(s => s.slice(0, 2).map(t => t.col + 'x' + t.n).join('/')).join(' ')); }
          if (to && L.lv < to) startLevel(L.lv + 1, parseInt(Q.get('seed') || '1', 10)); else break; } }   // 詰んでも次の面へ進む（範囲ぶんを一度に確認）
      if (Q.get('then') === 'title'){ const b = document.getElementById('bTitle'); if (b){ b.click(); res.push('TITLE:' + document.getElementById('bCont').textContent); } }   // 動作確認用: 終わった画面で「タイトルへ」を押し、タイトルのボタンの文字を出す
      if (!stopAt) document.title = res.join(' | ') || ('RUN lv' + L.lv + ' left' + G.left + ' t' + G.time.toFixed(0)); else { hideOv(); frozen = true; } }
    catch (e) { document.title = 'ERR ' + e.message + ' ' + (e.stack || '').split('\n')[1]; }
  } else setInterval(bot, 400); }

// ---------- 新しい版の自動読み込み（GitHub Pages で開いているときだけ） ----------
// 開いたままのタブやホーム画面のアプリは古い版のまま動き続ける（10/27 クリア後の修正が届かなかった）。画面に戻るたびに（30秒に1回まで）
// index.html の ETag を比べ、変わっていればタイトル画面なら今すぐ、遊んでいる途中ならタイトルに戻るときに読み込み直す
(() => {
  if (location.protocol !== 'https:' || !/\.github\.io$/.test(location.hostname)) return;
  let base = null, checking = false, lastChk = 0;
  const stamp = () => fetch(location.pathname, { method: 'HEAD', cache: 'no-store' }).then(r => r.ok ? (r.headers.get('etag') || r.headers.get('last-modified')) : null).catch(() => null);
  stamp().then(s => { if (s && !base) base = s; });
  const check = () => { const t = Date.now(); if (checking || navigator.onLine === false || t - lastChk < 30000) return; checking = true; lastChk = t;
    stamp().then(s => { checking = false; if (!s) return; if (!base){ base = s; return; }
      if (s !== base){ updatePending = true; if (mode === 'title') location.reload(); } }); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
  window.addEventListener('focus', check); window.addEventListener('online', check);
})();
requestAnimationFrame(loop);
})();
</script>
